<!doctype html>
<html lang="en" style="color-scheme: light !important; background-color: #ffffff !important; font-size: 18px;">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="only light" />
    <meta name="supported-color-schemes" content="light" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23000000' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10'/><path d='m9 12 2 2 4-4'/></svg>" />

    <title>Skin Lesion Classification</title>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      // Aggressively purge any cached dark mode
      try {
        localStorage.clear();
        sessionStorage.clear();
        document.documentElement.className = '';
        document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      :root {
        color-scheme: only light !important;
      }
      html {
        font-size: 18px !important;
        color-scheme: only light !important;
        background-color: #ffffff !important;
        background: #ffffff !important;
      }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #ffffff !important;
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 1rem;
        line-height: 1.6;
      }
      #root {
        background-color: #ffffff !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
    </style>

  <body class="bg-white text-black antialiased min-h-screen selection:bg-black selection:text-white" style="background-color: #ffffff !important; color: #000000 !important;">

    <script type="module" src="/src/main.jsx"></script>
